name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install (prepare builds dist/)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: node tests/run-all.mjs

      - name: Manifest checks
        run: node scripts/validate/check_manifest.mjs

      - name: Docs links
        run: pnpm check:docs

      - name: Private content / local paths
        run: pnpm check:private

      - name: Tool surface doc freshness
        run: pnpm check:tools

      - name: Version pin
        run: node scripts/validate/check_pin.mjs

      - name: Package contents
        if: runner.os == 'Linux'
        run: npm pack --dry-run
